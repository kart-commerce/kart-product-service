name: kart-product-service

services:
  postgres:
    image: postgres:16
    container_name: kart-product-postgres
    environment:
      POSTGRES_DB: kart_product
      POSTGRES_USER: kart_product_service
      POSTGRES_PASSWORD: changeme
    ports:
      - "5442:5432"
    volumes:
      - kart-product-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kart_product_service -d kart_product"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kart-product-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MongoDB sharded cluster (database-design.md: product_read_model sharded on category.id) ---
  # Minimal-but-real topology for local dev/verification: one config-server replset member, two
  # shard replset members (each a single-node replset - valid for dev, not HA), one mongos router.
  # scripts/init-mongo-cluster.sh performs rs.initiate/sh.addShard/sh.enableSharding/sh.shardCollection
  # once all nodes are up.
  mongo-configsvr:
    image: mongo:7.0
    container_name: kart-product-mongo-configsvr
    command: ["mongod", "--configsvr", "--replSet", "productCfgRS", "--port", "27019", "--bind_ip_all"]
    volumes:
      - kart-product-mongo-configsvr-data:/data/db

  mongo-shard1:
    image: mongo:7.0
    container_name: kart-product-mongo-shard1
    command: ["mongod", "--shardsvr", "--replSet", "productShard1RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - kart-product-mongo-shard1-data:/data/db

  mongo-shard2:
    image: mongo:7.0
    container_name: kart-product-mongo-shard2
    command: ["mongod", "--shardsvr", "--replSet", "productShard2RS", "--port", "27018", "--bind_ip_all"]
    volumes:
      - kart-product-mongo-shard2-data:/data/db

  mongo-router:
    image: mongo:7.0
    container_name: kart-product-mongo-router
    depends_on:
      - mongo-configsvr
      - mongo-shard1
      - mongo-shard2
    command: ["mongos", "--configdb", "productCfgRS/kart-product-mongo-configsvr:27019", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27117:27017"

  product-service:
    build:
      context: ..
      dockerfile: kart-product-service/Dockerfile
    container_name: kart-product-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo-router:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__ProductDatabase: "Host=postgres;Port=5432;Database=kart_product;Username=kart_product_service;Password=changeme"
      Mongo__ConnectionString: "mongodb://mongo-router:27017"
      Mongo__Database: "kart"
      RabbitMq__HostName: "rabbitmq"
      Jwt__Issuer: "kart-identity-service"
      Jwt__Audience: "kart-product-service"
      Jwt__SigningKey: "local-dev-signing-key-change-me-please-32chars-min"

volumes:
  kart-product-postgres-data:
  kart-product-mongo-configsvr-data:
  kart-product-mongo-shard1-data:
  kart-product-mongo-shard2-data:
